name: Native CI

on:
  pull_request:
  push:
    branches:
      - native-qobuz
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen ripgrep
      - name: Verify source and tests
        run: scripts/ci/verify.sh
      - name: Upload rendered UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-rendered-ui-macos-15
          path: Build/CI/UISnapshots/
          if-no-files-found: warn

  ui-snapshots:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen ripgrep
      - name: Verify macOS 26 rendered UI references
        run: scripts/ci/test_ui_snapshots.sh
      - name: Upload rendered UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-rendered-ui-macos-26
          path: Build/CI/UISnapshots/
          if-no-files-found: error

  release-portability:
    if: github.event_name != 'pull_request'
    needs:
      - verify
      - ui-snapshots
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen ripgrep
      - name: Build and verify movable release
        run: scripts/ci/release.sh
      - name: Upload release qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-native-release
          path: |
            dist-native/
            Build/CI/portability-report.json
          if-no-files-found: error

  intel-native:
    if: github.event_name != 'pull_request'
    needs: release-portability
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download universal release
        uses: actions/download-artifact@v4
        with:
          name: orpheus-native-release
          path: Build/CI/IntelRelease
      - name: Run core and app tests natively on Intel
        run: |
          scripts/ci/test_core.sh
          scripts/ci/test_app.sh
      - name: Verify release on Intel
        run: scripts/ci/test_intel_release.sh
      - name: Upload Intel qualification report
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-native-intel-portability
          path: Build/CI/intel-portability-report.json
          if-no-files-found: error
