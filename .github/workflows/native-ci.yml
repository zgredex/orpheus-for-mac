name: Native CI

on:
  pull_request:
  push:
    branches:
      - native-qobuz
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen ripgrep
      - name: Verify source and tests
        run: scripts/ci/verify.sh

  release-portability:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen ripgrep
      - name: Build and verify movable release
        run: scripts/ci/release.sh
      - name: Upload release qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orpheus-native-release
          path: |
            dist-native/
            Build/CI/portability-report.json
          if-no-files-found: error
