stages:
  - verify
  - release

default:
  tags:
    - macos
  interruptible: true
  before_script:
    - xcodegen version
    - rg --version
    - xcodebuild -version

native-verify:
  stage: verify
  script:
    - scripts/ci/verify.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - Build/CI/UISnapshots/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

native-release-portability:
  stage: release
  needs:
    - native-verify
  script:
    - scripts/ci/release.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist-native/
      - Build/CI/portability-report.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "native-qobuz"
    - if: $CI_PIPELINE_SOURCE == "web"
