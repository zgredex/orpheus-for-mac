name: OrpheusNative
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NativeQobuzCore:
    path: NativeQobuzCore
targets:
  OrpheusNative:
    type: application
    platform: macOS
    info:
      path: OrpheusNative/Info.plist
      properties:
        CFBundleDisplayName: Orpheus for Mac
        CFBundleName: Orpheus for Mac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.orpheus.formac.open
            CFBundleURLSchemes:
              - orpheus-for-mac
              - orpheus-native
        LSApplicationCategoryType: public.app-category.music
        NSHighResolutionCapable: true
    sources:
      - path: OrpheusNative
    dependencies:
      - package: NativeQobuzCore
        product: NativeQobuzCore
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.orpheus.formac
        PRODUCT_NAME: OrpheusNative
        SWIFT_VERSION: "5.10"
    postBuildScripts:
      - name: Sign Native Media Validator
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          RESOURCE_ROOT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          VALIDATOR_ROOT="$(find "$RESOURCE_ROOT" -type d -path '*/MediaValidator' -print -quit)"
          if [ -z "$VALIDATOR_ROOT" ]; then
            echo "error: Mandatory native media validator was not bundled"
            exit 1
          fi
          SIGNING_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          for binary in "$VALIDATOR_ROOT"/lib/*.dylib "$VALIDATOR_ROOT"/bin/orpheus-media-validator; do
            /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$binary"
          done
  OrpheusNativeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OrpheusNativeTests
    dependencies:
      - target: OrpheusNative
    settings:
      base:
        ARCHS: arm64
        ENABLE_APP_SANDBOX: false
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.orpheus.formac.tests
        SWIFT_VERSION: "5.10"
schemes:
  OrpheusNative:
    build:
      targets:
        OrpheusNative: all
        OrpheusNativeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OrpheusNativeTests
