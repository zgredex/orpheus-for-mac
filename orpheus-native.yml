name: OrpheusNative
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NativeQobuzCore:
    path: NativeQobuzCore
targets:
  OrpheusNative:
    type: application
    platform: macOS
    sources:
      - path: OrpheusNative
    dependencies:
      - package: NativeQobuzCore
        product: NativeQobuzCore
      - sdk: Security.framework
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        ENABLE_APP_SANDBOX: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Orpheus Native Preview
        INFOPLIST_KEY_CFBundleName: Orpheus Native Preview
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHighResolutionCapable: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.orpheus.native.preview
        PRODUCT_NAME: OrpheusNative
        SWIFT_VERSION: "5.10"
    postBuildScripts:
      - name: Sign Native Media Validator
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          RESOURCE_ROOT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          VALIDATOR_ROOT="$(find "$RESOURCE_ROOT" -type d -path '*/MediaValidator' -print -quit)"
          if [ -z "$VALIDATOR_ROOT" ]; then
            echo "error: Mandatory native media validator was not bundled"
            exit 1
          fi
          SIGNING_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          for binary in "$VALIDATOR_ROOT"/lib/*.dylib "$VALIDATOR_ROOT"/bin/orpheus-media-validator; do
            /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$binary"
          done
  OrpheusNativeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OrpheusNativeTests
    dependencies:
      - target: OrpheusNative
    settings:
      base:
        ARCHS: arm64
        ENABLE_APP_SANDBOX: false
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.orpheus.native.preview.tests
        SWIFT_VERSION: "5.10"
schemes:
  OrpheusNative:
    build:
      targets:
        OrpheusNative: all
        OrpheusNativeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OrpheusNativeTests
